name: PR Title

on:
  pull_request_target:
    types:
    - opened
    - edited
    - reopened
    - synchronize

permissions:
  pull-requests: read

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-slim

    steps:
    - name: Validate Conventional Commit title
      uses: amannn/action-semantic-pull-request@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          refactor
          perf
          docs
          test
          build
          ci
          chore
          revert
